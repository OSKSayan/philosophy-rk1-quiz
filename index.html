<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Философия РК1</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--fg:#1f1d1a;--muted:#6b665d;--line:#e3ded3;--accent:#3d5a80;--ok:#2e7d4f;--okbg:#e6f4ea;--bad:#b3261e;--badbg:#fbe9e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161513;--card:#201f1c;--fg:#ece8e1;--muted:#a19b90;--line:#34312c;--accent:#8fb3e0;--ok:#7fd19b;--okbg:#1d3326;--bad:#f2a49c;--badbg:#3a201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 16px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:12px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.q{font-size:19px;font-weight:600;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:12px 14px;display:flex;gap:10px}
.opt b{color:var(--muted);min-width:18px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{opacity:1}
.feedback{margin-top:14px;font-weight:600}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.big{font-size:44px;font-weight:700;margin:4px 0}
.mist{margin-top:18px;display:grid;gap:10px}
.mist div{border-left:3px solid var(--bad);padding:6px 12px;background:var(--bg);border-radius:0 8px 8px 0}
.mist small{color:var(--muted);display:block}
label{display:flex;gap:8px;align-items:center;margin:6px 0}
.hint{color:var(--muted);font-size:13px;margin-top:14px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Философия — подготовка к РК1</h1>
<p class="sub">Тест по всем вопросам из списка. Варианты перемешиваются при каждом запуске.</p>

<div id="start" class="card">
  <p style="margin-top:0"><b>Режим:</b></p>
  <label><input type="radio" name="mode" value="all" checked> Все вопросы (<span id="total"></span>)</label>
  <label><input type="radio" name="mode" value="30"> Случайные 30</label>
  <label><input type="radio" name="mode" value="order"> Все по порядку, как в списке</label>
  <div class="row" style="margin-top:14px"><button class="primary" id="go">Начать</button></div>
  <p class="hint">Клавиши: 1–4 выбрать ответ, Enter — следующий вопрос.</p>
</div>

<div id="quiz" class="card hidden">
  <div class="meta"><span id="cnt"></span><span id="sc"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <p class="q" id="qt"></p>
  <div class="opts" id="opts"></div>
  <div class="feedback" id="fb"></div>
  <div class="row" style="margin-top:16px;justify-content:space-between">
    <button id="quit">Завершить</button>
    <button class="primary" id="next" disabled>Далее →</button>
  </div>
</div>

<div id="res" class="card hidden">
  <div class="sub" style="margin:0">Результат</div>
  <div class="big" id="pct"></div>
  <div id="sum"></div>
  <div class="row" style="margin-top:16px">
    <button class="primary" id="retryWrong">Повторить ошибки</button>
    <button id="again">В начало</button>
  </div>
  <div class="mist" id="mist"></div>
</div>
</div>

<script>
// [вопрос, правильный ответ, [неправильные]]
const Q=[
["Как называется область человеческой деятельности, направленная на выработку и систематизацию объективных знаний о действительности?","Наука",["Религия","Искусство","Мифология"]],
["Как называется идейно-мировоззренческая позиция, в основе которой лежит представление о научном знании как о наивысшей культурной ценности и определяющем факторе ориентации человека в мире?","Сциентизм",["Антисциентизм","Иррационализм","Теоцентризм"]],
["Как называется активный, целенаправленный метод изучения явлений в точно фиксированных условиях, которые могут воссоздаваться и контролироваться самим исследователем?","Эксперимент",["Наблюдение","Моделирование","Аналогия"]],
["Кого в истории философии считают первым, «истинным философом», с которого начинается философия, т.к. он первый обратил внимание на окружающий мир?","Фалес",["Сократ","Пифагор","Гераклит"]],
["Как называется способ рассмотрения явлений мира, исходящий из единого начала, единой основы (субстанции) всего существующего?","Монизм",["Дуализм","Плюрализм","Агностицизм"]],
["Как называется способ рассмотрения явлений мира, исходящий из признания равноправными, не сводимыми друг к другу двух начал — духа и материи, идеального и реального?","Дуализм",["Монизм","Плюрализм","Пантеизм"]],
["Как называется направление в философии, сторонники которого признают первичным дух, сознание, идею?","Идеализм",["Материализм","Эмпиризм","Позитивизм"]],
["Какое философское направление решает основной вопрос философии в пользу первичности материи, природы, бытия, а сознание и мышление рассматривает как вторичное?","Материализм",["Идеализм","Дуализм","Скептицизм"]],
["Какая функция философии позволяет на основании имеющихся знаний о мире, человеке и достижений науки спрогнозировать тенденции развития человека, природы, общества?","Прогностическая",["Мировоззренческая","Методологическая","Аксиологическая"]],
["Кто дал такое определение сущности основного вопроса философии: «…вопрос об отношении мышления к бытию, сознания к материи... философы разделились на два больших лагеря, сообразно тому как отвечали на этот вопрос»?","Ф. Энгельс",["И. Кант","Г. Гегель","Р. Декарт"]],
["Какая функция способствует формированию целостной картины мира, представлений о его устройстве, месте человека в нём, принципах взаимодействия с окружающим миром?","Мировоззренческая",["Прогностическая","Методологическая","Критическая"]],
["Какая функция философии заключается в том, что она разрабатывает методы познания, которые затем используются в различных науках?","Методологическая",["Мировоззренческая","Аксиологическая","Социальная"]],
["Как называется функция философии, суть которой — в оценке вещей и явлений с точки зрения различных ценностей: морально-нравственных, этических, социальных, идеологических?","Аксиологическая (ценностная)",["Гносеологическая","Прогностическая","Методологическая"]],
["Кто из философов сформулировал главные вопросы философии: «Что есть человек? Что я могу знать? Что я должен делать? На что я могу надеяться?»","И. Кант",["Р. Декарт","Ф. Бэкон","Г. Гегель"]],
["Какая философская школа античности впервые поставила исходный философский вопрос о первоначале всего («Откуда всё?»)?","Милетская школа",["Элейская школа","Пифагорейская школа","Академия Платона"]],
["Как называется мировоззренческая концепция, основанная на представлении о Вселенной (космосе) как главной ценности и источнике всего существующего?","Космоцентризм",["Теоцентризм","Антропоцентризм","Социоцентризм"]],
["В каком разделе философии рассматриваются проблемы развития философии в хронологическом порядке, особенности исторических этапов, преемственность учений и идей?","История философии",["Онтология","Гносеология","Аксиология"]],
["Как называется философско-мировоззренческая позиция, в основе которой лежит представление о главенстве Бога?","Теоцентризм",["Космоцентризм","Антропоцентризм","Сциентизм"]],
["Как называется целостная система представлений об общих свойствах и закономерностях природы, возникающая в результате обобщения и синтеза основных естественнонаучных понятий и принципов?","Научная картина мира",["Мировоззрение","Мифология","Онтология"]],
["Как называется перенесение присущих человеку свойств и особенностей на внешние силы природы и приписывание их вымышленным существам?","Антропоморфизм",["Анимизм","Тотемизм","Фетишизм"]],
["Как называется нерасчленённость, слитность искусства, мифологии, религии, характеризующая первоначальное состояние первобытной культуры?","Синкретизм",["Эклектизм","Плюрализм","Анимизм"]],
["Какая мировоззренческая позиция была характерной особенностью философии эпохи Возрождения?","Антропоцентризм",["Теоцентризм","Космоцентризм","Сциентизм"]],
["Кого называли в арабоязычной философии «вторым учителем»?","Аль-Фараби",["Ибн Сину (Авиценну)","Ибн Рушда (Аверроэса)","Аль-Кинди"]],
["Труды какого античного философа аль-Фараби перевёл на арабский язык, сопровождая их комментариями?","Аристотеля",["Платона","Сократа","Демокрита"]],
["В произведениях какого казахского мыслителя подчёркивается роль генеалогических преданий для понимания этногенеза, памятников народной словесности для этнографии и исторической науки, типологического сходства в эпосе и легендах народов?","Чокана Валиханова",["Абая Кунанбаева","Ибрая Алтынсарина","Шакарима Кудайбердиева"]],
["Основатель казахского Просвещения, исследователь духовного мира казахов.","Чокан Валиханов",["Абай Кунанбаев","Шакарим Кудайбердиев","Ахмет Байтурсынов"]],
["Кто из античных философов своим учением определил «линию материализма» в философии?","Демокрит",["Платон","Сократ","Пифагор"]],
["Кто из античных философов своим учением определил «линию идеализма» в философии?","Платон",["Демокрит","Фалес","Гераклит"]],
["Кому принадлежит высказывание «Знание — сила!»?","Ф. Бэкону",["Р. Декарту","Сократу","И. Канту"]],
["Кто из античных учёных впервые применил научные методы познания в медицине?","Гиппократ",["Гален","Аристотель","Демокрит"]],
["Кто из казахских мыслителей создал первый профессиональный философский труд «Три истины»?","Шакарим Кудайбердиев",["Абай Кунанбаев","Чокан Валиханов","Ибрай Алтынсарин"]],
["Кто из античных философов создал всестороннюю систему философии, охватившую социологию, философию, политику, логику, физику?","Аристотель",["Платон","Сократ","Демокрит"]],
["Какое философское направление отрицает или ограничивает роль разума в познании, выдвигая на первый план волю, созерцание, чувство, интуицию?","Иррационализм",["Рационализм","Эмпиризм","Сенсуализм"]],
["Как называется высшая, присущая только людям и связанная с языком функция мозга обобщённо и целенаправленно отражать действительность?","Сознание",["Психика","Память","Ощущение"]],
["Что представляет собой важнейшее средство человеческого общения, социальное средство хранения и передачи информации, одно из средств управления человеческим поведением?","Язык",["Мышление","Сознание","Культура"]],
["Какая философская категория выражает высший уровень рационального познания?","Разум",["Рассудок","Ощущение","Восприятие"]],
["Как называется особое свойство живых организмов, основанное на высшей нервной деятельности и выражающееся в способности отражения действительности в ощущениях, восприятиях, чувствах, а у людей также в мышлении и воле?","Психика",["Сознание","Память","Интуиция"]],
["Как называется способность запечатлевать, сохранять и воспроизводить информацию, жизненный опыт?","Память",["Мышление","Воображение","Восприятие"]],
["Кто из выдающихся казахских общественных деятелей, писателей внёс вклад в изучение философских проблем языка, в частности казахского?","Ахмет Байтурсынов",["Чокан Валиханов","Шакарим Кудайбердиев","Аль-Фараби"]],
["Какое направление идеализма утверждает первичность всеобщего, мирового, сверхиндивидуального сознания или бессознательного начала?","Объективный идеализм",["Субъективный идеализм","Вульгарный материализм","Диалектический материализм"]],
["Какое философское учение признаёт началом бытия индивидуальное, личное сознание?","Субъективный идеализм",["Объективный идеализм","Материализм","Деизм"]],
["Для какого раздела философии предметом изучения являются фундаментальные принципы устройства бытия, его начала, сущностные формы, свойства и категории?","Онтология",["Гносеология","Аксиология","Этика"]],
["Как называется объективная реальность в аспекте внутреннего единства всех форм её саморазвития, всего многообразия явлений природы и истории, включая человека и его сознание, — фундаментальная категория научного познания?","Субстанция",["Материя","Бытие","Сознание"]],

["Что является первоначалом, первоосновой бытия по представлению античного философа Анаксимена?","Воздух",["Вода","Огонь","Апейрон"]],

["Как называется тип развития, для которого характерен переход от высшего к низшему, процесс деградации, понижения уровня организации?","Регресс",["Прогресс","Эволюция","Революция"]],
["Как называется радикальное, коренное, качественное изменение, скачок в развитии общества, природы или познания, сопряжённый с открытым разрывом с предыдущим состоянием?","Революция",["Эволюция","Регресс","Реформа"]],
["Как называется процесс медленных количественных и качественных необратимых исторических изменений в природе и обществе?","Эволюция",["Революция","Регресс","Скачок"]],
["Какая форма развития характеризуется необратимыми изменениями, в результате которых осуществляется переход от низшего к высшему, от менее совершенного к более совершенному?","Прогресс",["Регресс","Стагнация","Революция"]],
["Согласно Пифагору и его последователям, что является первоначалом, которое обладает большей степенью бытия, нежели вещи?","Число",["Атом","Идея","Огонь"]],
["Какое понятие использовал Демокрит для обозначения неделимых материальных элементов как первоначала мира?","Атом",["Апейрон","Монада","Логос"]],
["Как называется «философская категория для обозначения объективной реальности, которая дана человеку в ощущениях его, которая копируется, фотографируется, отображается нашими ощущениями, существуя независимо от них»?","Материя",["Субстанция","Бытие","Природа"]],
["Кому из древнегреческих философов принадлежит тезис: «Всё из воды и всё в воду»?","Фалесу",["Анаксимену","Гераклиту","Анаксимандру"]],
["Сторонники какой античной философской школы считали, что «движение, любое изменение являются лишь иллюзией чувственного мира»?","Элейской школы",["Милетской школы","Пифагорейской школы","Школы атомистов"]],

["Какая форма бытия материи выражает длительность существования материальных объектов и последовательность изменений (смены состояний) в процессе их развития?","Время",["Пространство","Движение","Отражение"]],
["Как называется, согласно Ф. Энгельсу, способ существования материи, её всеобщий атрибут, «изменение вообще»?","Движение",["Развитие","Время","Пространство"]],
["Кто является автором высказывания «Я мыслю, следовательно, существую»?","Р. Декарт",["Ф. Бэкон","И. Кант","Сократ"]],
["Какой раздел философии рассматривает возможности познания мира человеком, структуру познавательной деятельности, формы знания, критерии истинности и достоверности знания, его природу и границы?","Гносеология (теория познания)",["Онтология","Аксиология","Антропология"]],

const $=id=>document.getElementById(id);
$("total").textContent=Q.length;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let list=[],i=0,score=0,wrong=[],answered=false,cur=null;
function start(idx){list=idx;i=0;score=0;wrong=[];show("quiz");render()}
function show(id){["start","quiz","res"].forEach(s=>$(s).classList.toggle("hidden",s!==id))}
function render(){
  const q=Q[list[i]];answered=false;
  cur=shuffle([q[1],...q[2]]);
  $("cnt").textContent=`Вопрос ${i+1} из ${list.length}`;
  $("sc").textContent=`Верно: ${score}`;
  $("prog").style.width=(i/list.length*100)+"%";
  $("qt").textContent=q[0];
  $("fb").textContent="";$("fb").className="feedback";
  $("next").disabled=true;
  $("opts").innerHTML="";
  cur.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";
    b.innerHTML=`<b>${k+1}</b><span></span>`;b.lastChild.textContent=t;
    b.onclick=()=>pick(k);$("opts").appendChild(b)});
}
function pick(k){
  if(answered)return;answered=true;
  const q=Q[list[i]],btns=[...$("opts").children];
  btns.forEach((b,n)=>{b.disabled=true;if(cur[n]===q[1])b.classList.add("ok")});
  if(cur[k]===q[1]){score++;$("fb").textContent="Верно!";$("fb").classList.add("ok")}
  else{btns[k].classList.add("bad");wrong.push({idx:list[i],chosen:cur[k]});
    $("fb").textContent="Неверно. Правильный ответ: "+q[1];$("fb").classList.add("bad")}
  $("sc").textContent=`Верно: ${score}`;
  $("next").disabled=false;$("next").textContent=i===list.length-1?"Результат":"Далее →";$("next").focus();
}
function next(){if(!answered)return;i++;if(i>=list.length)finish();else render()}
function finish(){
  const total=Math.min(i,list.length)||1;
  show("res");
  $("pct").textContent=Math.round(score/total*100)+"%";
  $("sum").textContent=`Правильно ${score} из ${total}. Ошибок: ${wrong.length}.`;
  $("retryWrong").classList.toggle("hidden",!wrong.length);
  $("mist").innerHTML=wrong.length?"<b>Разбор ошибок:</b>":"<b>Без ошибок — отлично!</b>";
  wrong.forEach(w=>{const d=document.createElement("div");const q=Q[w.idx];
    d.innerHTML="<span></span><small></small><small></small>";
    d.children[0].textContent=q[0];
    d.children[1].textContent="Ваш ответ: "+w.chosen;
    d.children[2].textContent="Правильно: "+q[1];d.children[2].style.color="var(--ok)";
    $("mist").appendChild(d)});
}
$("go").onclick=()=>{const m=document.querySelector("input[name=mode]:checked").value;
  const all=Q.map((_,k)=>k);
  start(m==="order"?all:m==="30"?shuffle(all).slice(0,30):shuffle(all))};
$("next").onclick=next;
$("quit").onclick=()=>{if(answered)i++;finish()};
$("again").onclick=()=>show("start");
$("retryWrong").onclick=()=>start(shuffle(wrong.map(w=>w.idx)));
document.addEventListener("keydown",e=>{if($("quiz").classList.contains("hidden"))return;
  if(/^[1-4]$/.test(e.key))pick(+e.key-1);else if(e.key==="Enter"&&answered){e.preventDefault();next()}});
</script>
